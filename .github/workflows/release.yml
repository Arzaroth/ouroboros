# A tag is a release.
#
# There is no CHANGELOG.md to read the notes out of - the tree is one file and
# two workflows - so an annotated tag carries its own prose and this reads it
# back out with git.  Nothing is published that the suite has not just re-run
# against the tagged source, and the executable that ships is the very one the
# diff was taken against.
#
# Tags older than this file are in trees with no .github/ at all, so pushing
# them fires nothing; those releases were created by hand from the same tag
# messages.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.9.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install llvmlite

      - name: Every tier agrees with the oracle
        run: python ouroboros.py --selftest

      - name: The assurance battery
        run: python ouroboros.py --self-test

      - name: The self-hosting bootstrap reaches its fixpoint
        run: python ouroboros.py --bootstrap

      - name: The GSL-2 front end agrees with layer 16, byte for byte
        run: python ouroboros.py --close-the-loop

      - name: Random programs across every tier there is
        run: |
          python ouroboros.py --fuzz 120 --fuzz-seed ${{ github.run_number }} \
            --fuzz-native --fuzz-loop

      - name: Package
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Sanitize the ref so a path separator cannot break out of dist/.
          safe="${REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist
          cp ouroboros.py dist/
          python ouroboros.py --emit-elf "dist/glyph-$safe-linux-x86_64" > /dev/null
          python ouroboros.py --emit-llvm > "dist/glyph-$safe.ll"
          python ouroboros.py --emit-gsl2 glyphc > "dist/glyphc-$safe.gsl2"

          # The asset itself, not a sibling build, is what gets checked.
          diff <("./dist/glyph-$safe-linux-x86_64") <(python ouroboros.py)
          file "dist/glyph-$safe-linux-x86_64"
          ls -l dist

      - name: Release notes from the tag itself
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git tag -l --format='%(contents)' "$REF_NAME" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::$REF_NAME carries no message - falling back to generated notes."
            : > release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/ouroboros.py
            dist/glyph-*
            dist/glyphc-*
